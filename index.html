<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach Kettlebell</title>
<meta name="theme-color" content="#13171c">
<meta name="description" content="Séances kettlebell guidées, avec chrono, progression et export FIT.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach KB">
<style>
@font-face{font-family:"Barlow";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/barlow-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/barlow-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/barlow-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/barlow-condensed-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/barlow-condensed-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:800;font-style:normal;font-display:swap;src:url("fonts/barlow-condensed-latin-800-normal.woff2") format("woff2")}
/* Layout : une colonne mobile ; chaque séance est une borne de col (bandeau jaune, nom, altitude). Thème sombre unique, comme un écran de home-trainer. */
:root{
  --bg:#13171c; --panel:#1c232b; --line:#2c3640; --ink:#eef1f4; --muted:#93a0ad;
  --accent:#f5c400; --accent-ink:#13171c; --good:#4cc38a; --warn:#ff8a4c; --bad:#ff5d5d;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;font-weight:800;text-transform:uppercase}
h2{font-size:22px;font-weight:700;text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sync{font-size:12px;color:var(--muted);text-align:right}
nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-radius:10px;padding:4px;gap:4px}
nav.tabs button{background:none;border:0;padding:10px 4px;border-radius:7px;font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.alert{border-left:4px solid var(--warn);background:#2a2018;padding:10px 12px;border-radius:6px;font-size:15px}
/* Borne de col */
.borne{background:#f4f4f1;color:#14181c;border-radius:14px 14px 6px 6px;overflow:hidden;display:flex;flex-direction:column;text-align:left;border:0;padding:0;width:100%}
.borne .band{background:var(--accent);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.06em}
.borne .bd{padding:10px 14px 14px;display:flex;flex-direction:column;gap:4px}
.borne .name{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;text-transform:uppercase}
.borne .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#3e4852}
.borne.suggest{outline:3px solid var(--accent);outline-offset:3px}
.list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:13px;font-weight:600;background:var(--line);color:var(--ink)}
.pill.good{background:#1d3b2d;color:var(--good)}.pill.warn{background:#3b2a1d;color:var(--warn)}.pill.bad{background:#3b1d1d;color:var(--bad)}
.lvl{display:flex;align-items:center;gap:8px}
.lvl button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:20px}
.dots{display:flex;gap:4px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
.btn{border:0;border-radius:12px;padding:16px;font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--panel);color:var(--ink);font-size:18px;padding:12px}
.btn:disabled{opacity:.4}
/* Lecteur */
.player{min-height:100%;display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto;padding:16px}
.pbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.pbar b{display:block;height:100%;background:var(--accent);transition:width .3s}
.clock{font-family:var(--display);font-weight:700;font-size:20px}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center}
.stage .phase{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.stage .exname{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.02;text-transform:uppercase}
.stage .amount{font-family:var(--display);font-weight:800;font-size:76px;line-height:1;color:var(--accent)}
.stage .amount.rest{color:var(--good)}
.stage .cue{font-size:17px;max-width:40ch;margin:0 auto}
details.tech{background:var(--panel);border-radius:10px;padding:10px 14px;text-align:left;font-size:15px}
details.tech summary{font-weight:600;cursor:pointer}
.next{color:var(--muted);font-size:15px;text-align:center}
.ctrl{display:grid;grid-template-columns:1fr 2fr;gap:10px}
/* Retour */
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choices button{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 6px;font-weight:600}
.choices button[aria-pressed="true"]{border-color:var(--accent);background:#2b2a17}
input[type=range]{width:100%;accent-color:var(--accent)}
.knee{font-family:var(--display);font-size:42px;font-weight:800}
ul.changes{margin:0;padding-left:18px}
.hrbox{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hrv{font-family:var(--display);font-weight:800;font-size:26px;color:var(--bad)}
.hrlive{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--panel);border-radius:12px;padding:8px 12px;min-height:56px}
.hrlive .hrv{font-size:38px;line-height:1}
.hrlive .heart{color:var(--bad);font-size:26px}
.linkbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;font-weight:600}
.note{font-size:14px;color:var(--muted)}
.fig{display:block;background:var(--bg);border-radius:10px}
.fig line,.fig polyline{stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .ff{stroke:var(--ink);stroke-width:4}.fig .fb{stroke:#6f7c89;stroke-width:4}
.fig .fh{fill:var(--ink)}.fig .fk{fill:var(--accent)}
.fig .fg{stroke:var(--line);stroke-width:2}.fig .fpl{stroke:#55626f;stroke-width:3}.fig .fpr{fill:#3a4652}
.fig .fa{stroke:var(--accent);stroke-width:2}
.fig.thumb{width:66px;height:44px;flex:none}
.fig.big{width:186px;height:124px;margin:0 auto}
.exrow{display:flex;align-items:center;gap:12px}
.exrow+.exrow{border-top:1px solid var(--line);padding-top:8px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;padding:6px 0;text-align:left}
.toggle .sw{flex:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--accent)}.toggle[aria-pressed="true"] .sw::after{left:21px;background:var(--accent-ink)}
.sticky{position:sticky;bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.tile span{font-size:13px;color:var(--muted)}
.chart{display:block;width:100%;height:auto}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.chart .v{fill:var(--ink);font-weight:600}
.spark{width:96px;height:28px;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ---------- Données ---------- */
const EX = {
  goblet_squat:{n:"Goblet squat",knee:1,u:"reps",L:[["Descente 3 s",10],["Pause 2 s en bas",12],["Talons surélevés, pause 2 s",12],["Répétitions 1,5",10]],c:"KB contre la poitrine, descends en 3 s, coudes entre les genoux.",t:"Pieds un peu plus larges que les épaules. Descends le plus bas possible en gardant les talons au sol et le dos droit, puis remonte en poussant dans tout le pied."},
  split_squat:{n:"Split squat bulgare",knee:1,u:"reps",side:"jambe",L:[["Fente fixe au sol",8],["Pied arrière sur une chaise",8],["Pied arrière sur une chaise",12],["Répétitions 1,5",8]],c:"Commence par la jambe opérée. Descente 3 s, genou arrière qui frôle le sol.",t:"Le pied arrière sert d'appui, c'est la jambe avant qui pousse. Laisse le genou avant avancer au-delà des orteils s'il le veut."},
  step_up:{n:"Montée de marche",knee:1,u:"reps",side:"jambe",L:[["Marche basse",10],["Box à hauteur de genou",10],["Box genou, descente 4 s",10],["Box haute, descente 3 s",10]],c:"Pousse uniquement avec la jambe du haut, redescends lentement.",t:"KB en goblet. Pose tout le pied sur la box. Le pied resté au sol ne doit presque rien pousser."},
  reverse_lunge:{n:"Fente arrière",knee:1,u:"reps",side:"jambe",L:[["Sans KB",8],["KB en goblet",10],["Pied avant sur une marche",8],["Pied avant sur une marche",12]],c:"Grand pas en arrière, genou arrière qui frôle le sol.",t:"Remonte en poussant dans le talon avant et ramène le pied. Le buste reste droit."},
  swing:{n:"Swing à deux mains",knee:0,u:"reps",L:[["Swing",10],["Swing",15],["Swing",20],["Swing",25]],c:"Mouvement de hanche : les hanches projettent le KB, pas les bras.",t:"Lance le KB entre les jambes, puis pousse les hanches vers l'avant d'un coup sec. Le KB monte à hauteur de poitrine, bras relâchés. Ne plie pas les genoux comme dans un squat."},
  rdl1:{n:"Soulevé de terre roumain, une jambe",knee:0,u:"reps",side:"jambe",L:[["Main sur un mur",8],["Libre",10],["Libre",12],["Pause 2 s en bas",10]],c:"KB dans la main opposée, dos plat, la jambe libre recule.",t:"Penche le buste comme une balançoire jusqu'à sentir l'arrière de la cuisse. Les hanches restent face au sol. Remonte en serrant la fesse."},
  pushup:{n:"Pompes",knee:0,u:"reps",L:[["Mains surélevées",10],["Au sol",10],["Au sol",15],["Pieds surélevés",12]],c:"Corps gainé, coudes à 45°.",t:"Descends la poitrine à quelques centimètres du sol puis repousse. Le bassin ne tombe pas."},
  row:{n:"Rowing un bras",knee:0,u:"reps",side:"bras",L:[["Rowing",10],["Rowing",12],["Rowing",15],["Descente 3 s",12]],c:"Main libre sur une chaise, coude vers la hanche.",t:"Dos plat et parallèle au sol. Tire le KB vers la hanche en serrant l'omoplate, sans tourner le buste."},
  press:{n:"Développé un bras, genou au sol",knee:0,u:"reps",side:"bras",L:[["Développé",8],["Développé",10],["Développé",12],["Descente 3 s",10]],c:"Fesses serrées, côtes basses, biceps près de l'oreille.",t:"Le genou au sol est du côté du bras qui pousse. Pas de cambrure."},
  glute_bridge:{n:"Pont fessier",knee:0,u:"reps",side:"jambe",L:[["Deux jambes",15],["Une jambe",10],["Une jambe, KB sur la hanche",12],["Une jambe, KB, pause 3 s",12]],c:"Pousse dans le talon, pause en haut.",t:"Aligne épaules, hanches et genou en haut. Serre la fesse au lieu de cambrer le bas du dos."},
  dead_bug:{n:"Dead bug",knee:0,u:"reps",side:"côté",L:[["Sans KB",6],["KB tenu bras tendus",8],["KB tenu bras tendus",10],["Jambes presque tendues",10]],c:"Bas du dos collé au sol, mouvement lent.",t:"Sur le dos, hanches et genoux à 90°. Tends une jambe vers le sol sans la poser, reviens, alterne."},
  plank_pull:{n:"Planche, passage du KB",knee:0,u:"reps",side:"côté",L:[["Sur les genoux",6],["Pieds écartés",6],["Pieds écartés",8],["Pieds serrés",10]],c:"Le bassin ne tourne pas quand tu lèves la main.",t:"En planche bras tendus, attrape le KB en passant sous ton corps et tire-le de l'autre côté. Alterne les mains."},
  hollow:{n:"Hollow hold",knee:0,u:"sec",L:[["Genoux pliés",20],["Jambes tendues",30],["Jambes tendues",40],["Bras derrière la tête",45]],c:"Position banane, bas du dos collé au sol.",t:"Décolle épaules et jambes de quelques centimètres et tiens. Si le dos se décolle, plie les genoux."},
  side_plank:{n:"Planche latérale",knee:0,u:"sec",side:"côté",L:[["Sur le genou",20],["Jambes tendues",30],["Jambes tendues",40],["KB tenu bras tendu",45]],c:"Tête, bassin et pieds alignés, hanches hautes.",t:"Coude sous l'épaule. Change de côté au signal du milieu."},
  reverse_crunch:{n:"Relevé de bassin",knee:0,u:"reps",L:[["Relevé de bassin",8],["Relevé de bassin",10],["Relevé de bassin",12],["Descente 3 s",12]],c:"Enroule le bassin sans élan.",t:"Genoux pliés à 90° au-dessus des hanches. Amène les genoux vers la poitrine en décollant les fesses, redescends lentement."},
  tgu:{n:"Turkish get-up",knee:0,u:"reps",side:"côté",L:[["Demi, jusqu'au coude",2],["Demi, jusqu'à la main",3],["Demi, jusqu'à la main",4],["Complet",2]],c:"Lent, les yeux sur le KB, bras tendu.",t:"Pied du côté du KB au sol genou plié. Roule sur le coude, puis la main, jusqu'à être assis. Redescends dans l'ordre inverse."},
  wall_sit:{n:"Chaise murale",knee:1,u:"sec",L:[["Deux jambes",30],["Une jambe",20],["Une jambe",30],["Une jambe",45]],c:"Genou à 60–70°, le genou ne rentre pas vers l'intérieur.",t:"Dos contre le mur, un peu moins bas qu'un angle droit. Sur une jambe, change de jambe au signal du milieu."},
  reverse_nordic:{n:"Reverse Nordic",knee:1,u:"reps",L:[["Avec sangle, petite amplitude",6],["Avec sangle",8],["Sans sangle",6],["KB contre la poitrine",6]],c:"Fesses serrées, hanches et épaules alignées.",t:"À genoux sur un coussin, bascule en bloc en arrière puis reviens avec les quadriceps. Si les hanches se plient, réduis l'amplitude."},
  cossack:{n:"Squat cosaque",knee:1,u:"reps",side:"côté",L:[["Tenu à un support",4],["KB en contrepoids",5],["KB en contrepoids",6],["KB en contrepoids",8]],c:"Talon au sol, descends seulement jusque-là.",t:"Pieds très écartés. Descends sur une jambe, l'autre tendue sur le côté, pointe vers le haut."},
  carry:{n:"Marche fermier un bras",knee:0,u:"sec",side:"bras",L:[["Marche",30],["Marche",40],["Marche",50],["Marche",60]],c:"Buste parfaitement droit.",t:"KB le long du corps comme une valise. Change de main au signal du milieu."},
  /* Mobilité (pas d'adaptation) */
  patella_mob:{n:"Mobilisation de la rotule",fixed:1,u:"sec",L:[["Haut, bas, côtés",60]],c:"Jambe tendue et relâchée, fais glisser la rotule sans douleur.",t:""},
  rock:{n:"Balancier vers les talons",fixed:1,u:"sec",L:[["À quatre pattes",60]],c:"Recule les fesses vers les talons, tiens 20 s en bas à la fin.",t:""},
  couch:{n:"Couch stretch actif",fixed:1,u:"sec",side:"jambe",L:[["8 extensions puis tenu",90]],c:"Fesse serrée : décolle le pied du mur avec le quadriceps, ramène en 3 s, puis tiens.",t:"Genou au sol contre le mur sur un coussin. Change de jambe au signal du milieu, opérée en premier."},
  deep_squat:{n:"Squat profond tenu",fixed:1,u:"sec",L:[["KB en contrepoids",45]],c:"Talons au sol, descends jusqu'où le genou ne craque presque plus.",t:""},
  calf:{n:"Étirement du mollet sur marche",fixed:1,u:"sec",side:"jambe",L:[["Tendu puis genou un peu plié",60]],c:"Talon dans le vide, tiens-toi à la rampe.",t:"30 s jambe tendue, 30 s genou légèrement plié. Change de jambe au signal du milieu."}
  ,/* Échauffement (optionnel, sans charge) */
  w_march:{n:"Marche sur place",fixed:1,u:"sec",L:[["Genoux hauts, sans sauter",40]],c:"Monte les genoux à hauteur de hanche, balance les bras.",t:""},
  w_arms:{n:"Cercles de bras",fixed:1,u:"sec",L:[["Grands cercles",30]],c:"Grands cercles lents, 15 s vers l'avant puis 15 s vers l'arrière.",t:""},
  w_hinge:{n:"Charnière de hanche",fixed:1,u:"sec",L:[["Sans charge",30]],c:"Mains sur les hanches, recule les fesses dos plat, puis redresse-toi en serrant les fessiers.",t:""},
  w_squat:{n:"Squat sans charge",fixed:1,u:"sec",L:[["Amplitude confortable",30]],c:"Descends lentement jusqu'où le genou reste à l'aise, bras devant.",t:""}
};
const WARMUP=["w_march","w_arms","w_hinge","w_squat"];
const KGS=[4,6,8,10,12,14,16,18,20,24];
const WORKOUTS = [
  {id:"galibier",name:"Galibier",alt:2642,mode:"chrono",rounds:4,ex:["goblet_squat","pushup","swing","dead_bug"],focus:"Corps entier, pour le temps"},
  {id:"izoard",name:"Izoard",alt:2360,mode:"chrono",rounds:3,ex:["step_up","row","rdl1","side_plank","carry"],focus:"Une jambe et tirage, pour le temps"},
  {id:"tourmalet",name:"Tourmalet",alt:2115,mode:"intervals",work:40,rest:20,rounds:4,ex:["split_squat","swing","press","glute_bridge","reverse_crunch"],focus:"Intervalles 40 s / 20 s, 20 min"},
  {id:"ventoux",name:"Ventoux",alt:1910,mode:"chrono",rounds:3,ex:["dead_bug","plank_pull","hollow","side_plank","reverse_crunch","tgu"],focus:"Abdos, pour le temps"},
  {id:"aubisque",name:"Aubisque",alt:1709,mode:"series",rest:60,rounds:3,ex:["reverse_nordic","split_squat","cossack","wall_sit","reverse_lunge"],focus:"Quadriceps sous étirement, séries"},
  {id:"croix-rousse",name:"Croix-Rousse",alt:254,mode:"chrono",rounds:1,ex:["patella_mob","rock","couch","deep_squat","calf"],focus:"Routine genou, 8 min",daily:1}
];
const MODE_LABEL={chrono:"Pour le temps",intervals:"Intervalles",series:"Séries"};

/* ---------- Stockage ---------- */
const LS="kbcoach.v1";
const DEF_SET={voice:true,warm:true,kg:8};
let S={levels:{},streak:{},sessions:[],settings:{...DEF_SET}};
let db=null, syncState="local";
function loadLocal(){try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);S.levels=o.levels||{};S.streak=o.streak||{};S.sessions=o.sessions||[];S.settings={...DEF_SET,...(o.settings||{})};}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function lvl(id){const e=EX[id];const v=S.levels[id];return Math.max(0,Math.min(e.L.length-1,typeof v==="number"?v:0));}
async function initDb(){
  for(let k=0;k<30&&!(window.claude&&window.claude.use);k++)await new Promise(r=>setTimeout(r,100));
  try{
    db=window.claude&&window.claude.use?await window.claude.use("db"):null;
  }catch(e){db=null}
  if(!db){syncState="local";render();return;}
  syncState="loading";render();
  const timer=setTimeout(()=>{if(syncState==="loading"){syncState="slow";render();}},10000);
  try{
    const p=await db.doc("state/progress").get();
    const q=await db.collection("sessions").orderBy("date","desc").limit(200).get();
    clearTimeout(timer);
    if(p.exists||!q.empty){
      const d=p.data()||{};S.levels=d.levels||{};S.streak=d.streak||{};
      S.sessions=q.docs.map(x=>x.data());
      saveLocal();
    }else if(S.sessions.length||Object.keys(S.levels).length){
      await db.doc("state/progress").set({levels:S.levels,streak:S.streak,updatedAt:new Date().toISOString()});
      for(const s of S.sessions){await db.collection("sessions").doc(s.id).set(s);}
    }
    syncState="db";
  }catch(e){clearTimeout(timer);syncState="local";}
  render();
}
async function persist(session){
  saveLocal();
  if(!db||syncState!=="db")return;
  try{

/* ---------- Ceinture cardio (Bluetooth) ---------- */
const HR={dev:null,bpm:0,at:0,since:0,msg:"",busy:false};
function hrLive(){return HR.dev&&HR.bpm&&Date.now()-HR.at<5000?HR.bpm:0}
const HR_WAIT="Connectée, en attente du signal : mets la ceinture et mouille bien les électrodes.";
function hrWaiting(){return !!HR.dev&&!hrLive()&&Date.now()-HR.since>3000}
function hrPaint(){
  const t=hrLive()||"--";document.querySelectorAll(".hrv-n").forEach(el=>el.textContent=t);
  const w=hrWaiting();document.querySelectorAll(".hr-wait").forEach(el=>el.hidden=!w);
}
function hrDisconnect(silent){
  const d=HR.dev;HR.dev=null;HR.bpm=0;HR.msg="";
  try{if(d&&d.gatt&&d.gatt.connected)d.gatt.disconnect();}catch(e){}
  if(!silent)render();
}
/* Libère la ceinture quand la page se ferme : sinon Chrome Android peut la garder et elle devient invisible pour les autres applis. */
window.addEventListener("pagehide",()=>hrDisconnect(true));
setInterval(()=>{if(HR.dev)hrPaint();},1000);
async function hrAttach(dev){
  const srv=await dev.gatt.connect();
  const ch=await(await srv.getPrimaryService("heart_rate")).getCharacteristic("heart_rate_measurement");
  ch.addEventListener("characteristicvaluechanged",ev=>{const v=ev.target.value,f=v.getUint8(0);HR.bpm=f&1?v.getUint16(1,true):v.getUint8(1);HR.at=Date.now();hrPaint();});
  await ch.startNotifications();
}
async function hrReconnect(dev){
  for(let k=0;k<5&&HR.dev===dev;k++){
    HR.msg="Ceinture déconnectée, reconnexion…";render();
    await new Promise(r=>setTimeout(r,1500*(k+1)));
    try{await hrAttach(dev);HR.since=Date.now();HR.msg="";render();return;}catch(e){}
  }
  if(HR.dev===dev){HR.dev=null;HR.bpm=0;HR.msg="Ceinture déconnectée. Mouille les électrodes et reconnecte-la.";render();}
}
async function connectHr(){
  if(HR.busy)return;
  if(!navigator.bluetooth){HR.msg="Bluetooth indisponible dans ce navigateur. Sur iPhone, Safari et Chrome ne le permettent pas : ouvre la page dans l'appli Bluefy. Sur Android, ouvre-la dans Chrome.";render();return;}
  HR.busy=true;HR.msg="";render();
  try{
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:["heart_rate"]}]});
    await hrAttach(dev);
    dev.addEventListener("gattserverdisconnected",()=>{if(HR.dev===dev)hrReconnect(dev);});
    HR.dev=dev;HR.since=Date.now();HR.msg="";
  }catch(e){
    HR.msg=e&&e.name==="NotFoundError"?"Aucune ceinture choisie. Mouille les électrodes et réessaie.":e&&e.name==="SecurityError"?"Le Bluetooth est bloqué dans cette fenêtre. Ouvre la page dans Chrome sur Android ou sur ordinateur.":"Connexion impossible : "+(e&&e.message||"erreur inconnue");
  }
  HR.busy=false;render();
}
function hrPlayer(){
  if(HR.dev)return `<div class="hrlive" aria-live="off"><span class="heart" aria-hidden="true">♥</span><span class="hrv num"><span class="hrv-n">${hrLive()||"--"}</span></span><span class="muted">bpm</span></div><div class="note hr-wait" style="text-align:center"${hrWaiting()?"":" hidden"}>${HR_WAIT}</div>${HR.msg?`<div class="note" style="text-align:center">${esc(HR.msg)}</div>`:""}`;
  return `<div class="hrlive"><button class="linkbtn" id="hrc">${HR.busy?"Connexion…":"♥ Connecter la ceinture cardio"}</button></div>${HR.msg?`<div class="note" style="text-align:center">${esc(HR.msg)}</div>`:""}`;
}
function hrCard(){
  const live=hrLive();
  return `<div class="card"><div class="hrbox"><div><strong>Ceinture cardio</strong><div class="small muted">${HR.dev?esc(HR.dev.name||"Connectée"):"Non connectée : la séance sera enregistrée sans fréquence cardiaque"}</div></div>
  ${HR.dev?`<span class="row"><span class="hrv num"><span class="hrv-n">${live||"--"}</span> <span class="small">bpm</span></span><button class="linkbtn" id="hrx">Déconnecter</button></span>`:`<button class="linkbtn" id="hrc">${HR.busy?"Connexion…":"Connecter"}</button>`}</div>
  <div class="note hr-wait"${hrWaiting()?"":" hidden"}>${HR_WAIT}</div>
  ${HR.msg?`<div class="note">${esc(HR.msg)}</div>`:""}</div>`;
}

const CRC_T=[0x0000,0xCC01,0xD801,0x1400,0xF001,0x3C00,0x2800,0xE401,0xA001,0x6C00,0x7800,0xB401,0x5000,0x9C01,0x8801,0x4400];

  def(1,21,[[253,4,0x86],[0,1,0],[1,1,0]]);rec(1,[start,0,0]);
  if(valid.length){def(2,20,[[253,4,0x86],[3,1,2]]);hr.forEach((b,i)=>{if(b>0&&i<=dur)rec(2,[start+i,b]);});}
  rec(1,[end,0,4]);
  def(3,19,[[253,4,0x86],[2,4,0x86],[7,4,0x86],[8,4,0x86],[0,1,0],[1,1,0],[15,1,2],[16,1,2],[25,1,0],[39,1,0]]);rec(3,[end,start,dur*1000,dur*1000,9,1,avg,max,10,20]);
  def(4,18,[[253,4,0x86],[2,4,0x86],[7,4,0x86],[8,4,0x86],[0,1,0],[1,1,0],[5,1,0],[6,1,0],[16,1,2],[17,1,2],[25,2,0x84],[26,2,0x84]]);rec(4,[end,start,dur*1000,dur*1000,8,1,10,20,avg,max,0,1]);

  if(!(window.claude&&window.claude.use)){
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;
    document.body.appendChild(a);a.click();a.remove();if(btn)btn.textContent="Fichier enregistré";return;
  }
  try{
    dl=dl||await window.claude.use("downloads");
    if(!dl)throw {code:"unavailable"};
    await dl.save({filename:name,data});
    if(btn)btn.textContent="Fichier enregistré";
  }catch(e){
    if(btn)btn.textContent=e&&e.code==="declined"?"Export annulé":"Export impossible ici";
  }
}

let importMsg="";
async function importJson(file){
  try{
    const o=JSON.parse(await file.text());
    if(!o||o.app!=="coach-kettlebell"||!Array.isArray(o.sessions))throw new Error("format");
    const known=new Set(S.sessions.map(s=>s.id));
    const added=o.sessions.filter(s=>s&&s.id&&s.workoutId&&!known.has(s.id));
    const newestFile=o.sessions.reduce((m,s)=>Math.max(m,new Date(s.date).getTime()||0),0);
    const newestHere=S.sessions.reduce((m,s)=>Math.max(m,new Date(s.date).getTime()||0),0);
    if(newestFile>newestHere){S.levels=o.levels||S.levels;S.streak=o.streak||S.streak;if(o.settings)S.settings={...DEF_SET,...o.settings};}
    S.sessions=S.sessions.concat(added).sort((a,b)=>new Date(b.date)-new Date(a.date));
    saveLocal();
    if(db&&syncState==="db"){
      try{await db.doc("state/progress").set({levels:S.levels,streak:S.streak,updatedAt:new Date().toISOString()});
        for(const s of added)await db.collection("sessions").doc(s.id).set(s);}catch(e){syncState="local";}
    }
    importMsg=added.length?added.length+" séance(s) importée(s)."+(newestFile>newestHere?" Niveaux repris du fichier, plus récent.":" Niveaux actuels conservés, plus récents que le fichier."):"Aucune nouvelle séance : tout était déjà là.";
  }catch(e){importMsg="Fichier non reconnu. Choisis un export JSON de cette appli.";}
  render();
}

function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function sparkline(vals,lo,hi){
  const W=96,H=28,n=vals.length;if(hi===lo){hi=lo+1;}
  const pt=(v,i)=>[(n>1?4+i*(W-8)/(n-1):W/2),4+(H-8)*(1-(v-lo)/(hi-lo))];

function statsCard(){

    <svg class="chart" viewBox="0 0 ${kW} ${kH}" role="img" aria-label="Gêne au genou sur 10 : ${ks.map(s=>s.knee||0).join(", ")}">
    ${[0,5,10].map(v=>`<line x1="${x0}" y1="${y(v)}" x2="${x1}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${x0-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join("")}
    <line x1="${x0}" y1="${y(3)}" x2="${x1}" y2="${y(3)}" stroke="var(--warn)" stroke-width="1" stroke-dasharray="4 4"/><text x="${x1+4}" y="${y(3)+4}">seuil</text>
    <polyline points="${ks.map((s,i)=>x(i).toFixed(1)+","+y(s.knee||0).toFixed(1)).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${ks.map((s,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(s.knee||0).toFixed(1)}" r="${i===ks.length-1?4.5:3}" fill="var(--ink)" stroke="var(--panel)" stroke-width="2"><title>${dfmt(s.date)} : ${s.knee||0}/10</title></circle>`).join("")}
    <text class="v" x="${x1+4}" y="${Math.abs(y(lastK)-y(3))<12?y(lastK)-10:y(lastK)+4}">${lastK}/10</text></svg>`;
  }
  /* Records : évolution des temps */
  const recs=WORKOUTS.filter(w=>w.mode==="chrono"&&!w.daily).map(w=>{
    const l=sessionsOf(w.id).filter(s=>s.durationSec).slice().reverse().map(wsec);

  }).join("");
  return `<div class="card"><h2>Suivi</h2>
  <div class="tiles"><div class="tile"><b class="num">${counts[N-1]}</b><span>cette semaine</span></div><div class="tile"><b class="num">${streak}</b><span>semaine${streak>1?"s":""} d'affilée</span></div><div class="tile"><b class="num">${S.sessions.length}</b><span>séances au total</span></div></div>

/* ---------- Construction et lecture d'une séance ---------- */
function spoken(e,a,timed){return (timed?a+" secondes":a+" répétition"+(a>1?"s":""))+(e.side?" par "+e.side:"");}
function buildSteps(w,warm){
  const steps=[];
  if(warm&&!w.daily)WARMUP.forEach((id,k)=>{const e=EX[id],[label,a]=e.L[0];steps.push({kind:"work",id,r:0,warm:1,label:"Échauffement "+(k+1)+"/"+WARMUP.length,secs:a,timed:true,txt:a+" s",say:(k?"":"Échauffement. ")+a+" secondes"});});
  for(let r=1;r<=w.rounds;r++){
    w.ex.forEach((id,i)=>{
      const e=EX[id],[label,a]=e.L[lvl(id)];
      if(w.mode==="intervals"){
        steps.push({kind:"work",id,r,label,secs:w.work,txt:"Max propre"+(e.side?", change de "+e.side+" à mi-temps":""),say:w.work+" secondes"+(e.side?", change de "+e.side+" à mi-temps":"")});
        if(!(r===w.rounds&&i===w.ex.length-1))steps.push({kind:"rest",secs:w.rest});
      }else{
        const timed=e.u==="sec";
        const secs=timed?a*(e.side?2:1):0;
        steps.push({kind:"work",id,r,label,secs,timed,txt:timed?(e.side?a+" s / "+e.side:a+" s"):a+(e.side?" / "+e.side:""),say:spoken(e,a,timed)});
        if(w.mode==="series"&&!(r===w.rounds&&i===w.ex.length-1))steps.push({kind:"rest",secs:w.rest});
      }
    });
  }
  return steps;
}
function estimate(w,warm){
  let t=0;
  for(const st of buildSteps(w,warm)){
    if(st.secs)t+=st.secs;else{const e=EX[st.id],a=e.L[lvl(st.id)][1];t+=a*(e.side?2:1)*3;}
    if(st.kind==="work"&&w.mode!=="intervals")t+=10;
  }
  return t;
}
function audioOn(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume();}catch(e){}}

function startWorkout(wid){
  const w=WORKOUTS.find(x=>x.id===wid);
  audioOn();
  run={w,steps:buildSteps(w,S.settings.warm),i:0,t0:Date.now(),hr:[],startIso:new Date().toISOString(),paused:0,pauseAt:0,stepStart:Date.now(),lastBeep:-1,half:false,tick:null,warmSec:0,lastSave:0};
  keepAwake(true);beep(660,.2);

  run.tick=setInterval(tick,250);
}
function elapsed(){return ((run.pauseAt||Date.now())-run.t0-run.paused)/1000}
function shown(){const st=run.steps[run.i];return st&&st.warm?elapsed():elapsed()-(run.warmSec||0)}
function stepElapsed(){return ((run.pauseAt||Date.now())-run.stepStart)/1000}
function tick(){
  if(!run||run.pauseAt)return;
  const b=hrLive();if(b)run.hr[Math.floor(elapsed())]=b;
  const st=run.steps[run.i];
  if(st.secs){
    const left=st.secs-stepElapsed();
    const s=Math.ceil(left);
    if(s<=3&&s>=1&&s!==run.lastBeep){run.lastBeep=s;beep(880);}
    if(st.kind==="work"&&EX[st.id]?.side&&st.timed!==false&&!run.half&&left<=st.secs/2){run.half=true;beep(520,.25);say("Change de "+EX[st.id].side);}
    if(left<=0){next();return;}
  }
  updateClock();
  if(Date.now()-run.lastSave>5000)saveRun();
}
function next(){
  if(!run)return;
  const prev=run.steps[run.i];
  run.i++;run.stepStart=Date.now();run.lastBeep=-1;run.half=false;
  if(prev&&prev.warm&&!(run.steps[run.i]&&run.steps[run.i].warm))run.warmSec=elapsed();
  if(run.i>=run.steps.length){finish();return;}
  beep(run.steps[run.i].kind==="rest"?440:990,.18);
  render();sayStep();saveRun();
}
function finish(){
  clearInterval(run.tick);keepAwake(false);beep(990,.4);
  const hr=Array.from({length:Math.round(elapsed())+1},(_,i)=>run.hr[i]||0);
  const dur=Math.round(elapsed()),ws=Math.round(run.warmSec||0);
  fb={w:run.w,dur,work:Math.max(1,dur-ws),difficulty:null,knee:0,start:run.startIso,hr:hr.some(x=>x)?hr:null};
  run=null;saveDone();say("Séance terminée. Bravo !");view="feedback";render();
}
function quit(){clearInterval(run.tick);keepAwake(false);run=null;clearRun();try{speechSynthesis.cancel();}catch(e){}view="home";render();}
function updateClock(){
  const c=$("#clock");if(c)c.textContent=fmt(shown());
  const st=run.steps[run.i];const a=$("#amount");
  if(a&&st.secs)a.textContent=fmt(Math.max(0,st.secs-stepElapsed()));
}
function renderPlayer(app){
  const {w,steps,i}=run,st=steps[i];
  const works=steps.filter(s=>s.kind==="work").length,doneW=steps.slice(0,i).filter(s=>s.kind==="work").length;
  const nxt=steps.slice(i+1).find(s=>s.kind==="work");
  let stage;
  if(st.kind==="rest"){
    stage=`<div class="phase">Récupération</div><div class="amount rest num" id="amount">${fmt(st.secs)}</div>
    ${nxt?`<div class="cue">Ensuite : <strong>${esc(EX[nxt.id].n)}</strong> · ${esc(nxt.txt)}</div>`:""}`;
  }else{
    const e=EX[st.id];
    stage=`<div class="phase">${st.warm?esc(st.label):(w.rounds>1?"Tour "+st.r+" / "+w.rounds:esc(w.name))+" · "+esc(st.label)}</div>
    <div class="exname">${esc(e.n)}</div>
    ${fig(st.id,"big")}
    <div class="amount num" id="amount">${st.secs?fmt(st.secs):esc(st.txt)}</div>
    ${st.secs&&w.mode!=="intervals"?`<div class="muted">${esc(st.txt)}</div>`:""}${w.mode==="intervals"?`<div class="muted">${esc(st.txt)}</div>`:""}
    <div class="cue">${esc(e.c)}</div>
    ${e.t?`<details class="tech"><summary>Technique</summary><p style="margin:.5em 0 0">${esc(e.t)}</p></details>`:""}`;
  }
  const manual=st.kind==="work"&&!st.secs;
  app.innerHTML=`<div class="player">
    <div class="row"><strong style="font-family:var(--display);font-size:22px;text-transform:uppercase">${esc(w.name)}</strong><span class="row"><button class="linkbtn" id="voice" aria-pressed="${!!S.settings.voice}">${S.settings.voice?"Voix activée":"Voix coupée"}</button><span class="clock num" id="clock">${fmt(shown())}</span></span></div>
    <div class="pbar" aria-label="Progression"><b style="width:${Math.round(doneW/works*100)}%"></b></div>
    ${hrPlayer()}
    <div class="stage">${stage}</div>
    ${nxt&&st.kind==="work"?`<div class="next">Ensuite : ${esc(EX[nxt.id].n)} · ${esc(nxt.txt)}</div>`:""}
    <div class="ctrl"><button class="btn ghost" id="pause">${run.pauseAt?"Reprendre":"Pause"}</button>
    <button class="btn" id="go">${manual?"Fait":st.kind==="rest"?"Passer le repos":"Suivant"}</button></div>
    <button class="btn ghost" id="quit">Arrêter la séance</button></div>`;
  $("#go").onclick=()=>{if(run.pauseAt)togglePause();next();};
  $("#pause").onclick=togglePause;
  $("#voice").onclick=()=>{S.settings.voice=!S.settings.voice;saveLocal();if(!S.settings.voice){try{speechSynthesis.cancel();}catch(e){}}render();if(S.settings.voice)sayStep();};
  const hc=$("#hrc");if(hc)hc.onclick=connectHr;const hx=$("#hrx");if(hx)hx.onclick=()=>hrDisconnect();
  $("#quit").onclick=()=>{if(run.quitArm){quit();}else{run.quitArm=true;$("#quit").textContent="Appuie encore pour arrêter sans enregistrer";setTimeout(()=>{if(run){run.quitArm=false;const q=$("#quit");if(q)q.textContent="Arrêter la séance";}},3000);}};
}
function togglePause(){
  if(run.pauseAt){const d=Date.now()-run.pauseAt;run.paused+=d;run.stepStart+=d;run.pauseAt=0;}else run.pauseAt=Date.now();
  saveRun();render();
}

/* ---------- Retour et adaptation ---------- */
function renderFeedback(app){
  const w=fb.w,pb=best(w.id),isPb=w.mode==="chrono"&&(!pb||fb.work<pb);
  app.innerHTML=`<div class="wrap"><div class="card" style="text-align:center"><div class="muted">${esc(w.name)} terminé</div>
    <div class="knee num">${fmt(fb.work)}</div>${fb.dur>fb.work?`<div class="small muted">+ ${fmt(fb.dur-fb.work)} d'échauffement</div>`:""}${w.mode==="chrono"?(isPb?'<span class="pill good">Nouveau record</span>':`<span class="muted small">Record : ${fmt(pb)}</span>`):""}</div>
    ${w.daily?"":`<div class="card"><h2>Difficulté</h2><div class="choices">${[["facile","Trop facile"],["parfait","Parfait"],["dur","Trop dur"]].map(([k,l])=>`<button data-diff="${k}" aria-pressed="${fb.difficulty===k}">${l}</button>`).join("")}</div></div>`}
    <div class="card"><div class="row"><h2>Genou</h2><span class="knee num" id="kv">${fb.knee}/10</span></div>
    <label for="knee" class="small muted">Gêne ou douleur à l'avant du genou pendant la séance</label>
    <input type="range" id="knee" min="0" max="10" step="1" value="${fb.knee}"></div>
    <button class="btn" id="save" ${!w.daily&&!fb.difficulty?"disabled":""}>Enregistrer</button>
    <button class="btn ghost" id="skip">Ne pas enregistrer</button></div>`;
  app.querySelectorAll("[data-diff]").forEach(b=>b.onclick=()=>{fb.difficulty=b.dataset.diff;renderFeedback(app);});
  $("#knee").oninput=e=>{fb.knee=+e.target.value;$("#kv").textContent=fb.knee+"/10";};
  $("#save").onclick=saveSession;
  $("#skip").onclick=()=>{if($("#skip").dataset.arm){fb=null;clearRun();view="home";render();}else{$("#skip").dataset.arm=1;$("#skip").textContent="Appuie encore pour supprimer cette séance";}};
}
function adapt(w,diff,knee){
  const changes=[];if(w.daily)return changes;
  let up=false;
  if(diff==="facile"&&knee<=2)up=true;
  if(diff==="parfait"&&knee<=2){S.streak[w.id]=(S.streak[w.id]||0)+1;if(S.streak[w.id]>=2){up=true;S.streak[w.id]=0;}}else S.streak[w.id]=0;
  for(const id of [...new Set(w.ex)]){
    const e=EX[id];if(e.fixed)continue;
    let d=0;
    if(knee>=4&&e.knee)d=-1;else if(diff==="dur")d=-1;else if(up&&!(e.knee&&knee>=3))d=1;
    const before=lvl(id),after=Math.max(0,Math.min(e.L.length-1,before+d));
    if(after!==before){S.levels[id]=after;changes.push(e.n+(after>before?" ↑ ":" ↓ ")+e.L[after][0]+", "+amountTxt(id));}
  }
  return changes;
}
async function saveSession(){
  const w=fb.w,diff=w.daily?"parfait":fb.difficulty;
  const changes=adapt(w,diff,fb.knee);
  const s={id:"s"+Date.now(),date:new Date().toISOString(),start:fb.start,workoutId:w.id,workoutName:w.name,mode:w.mode,durationSec:fb.dur,difficulty:diff,knee:fb.knee,changes,kg:S.settings.kg};
  if(fb.work&&fb.work<fb.dur)s.workSec=fb.work;
  if(fb.hr){const v=fb.hr.filter(x=>x>0);s.hr=fb.hr;s.hrAvg=Math.round(v.reduce((a,b)=>a+b,0)/v.length);s.hrMax=Math.max(...v);}
  S.sessions.unshift(s);
  fb.changes=changes;fb.saved=s;clearRun();
  view="done";render();
  await persist(s);
}
function renderDone(app){
  const c=fb.changes||[];
  const msg=fb.knee>=4?"Ton genou a gêné : les exercices qui le chargent baissent d'un niveau. Si la gêne dure jusqu'à demain, fais seulement la routine Croix-Rousse.":c.length?"Ta prochaine séance s'ajuste :":fb.w.daily?"Routine enregistrée.":"Les niveaux restent les mêmes pour la prochaine fois.";
  app.innerHTML=`<div class="wrap"><div class="card"><h2>Séance enregistrée</h2><p style="margin:0">${esc(msg)}</p>${c.length?`<ul class="changes">${c.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</div>
  <button class="btn ghost" id="exp">Exporter pour intervals.icu</button>
  <button class="btn" id="home">Retour aux cols</button></div>`;
  $("#exp").onclick=e=>exportSession(fb.saved.id,e.currentTarget);
  $("#home").onclick=()=>{fb=null;view="home";tab="seances";render();};
}

/* ---------- Démarrage ---------- */
loadLocal();render();initDb();
</script>

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
